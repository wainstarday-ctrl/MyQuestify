name: Загрузка весов модели

# Составной шаг: загружает веса языковой модели и проверяет целостность.
# Вынесен отдельно, потому что используется двумя сборками — Windows и
# macOS — и повторение одних и тех же строк в двух местах рано или поздно
# привело бы к расхождению.
#
# Проверка размера обязательна. Загрузка объёмом больше гигабайта
# обрывается достаточно часто, а усечённый файл ведёт себя хуже
# отсутствующего: приложение находит его, пытается прочитать и падает при
# первом же обращении к модели вместо того, чтобы перейти на резервные
# фразы.

description: Загружает веса Vikhr-Qwen-2.5-1.5B и проверяет их целостность

inputs:
  target-dir:
    description: Каталог, куда положить model.gguf
    required: false
    default: models

outputs:
  size-mb:
    description: Размер загруженного файла в мегабайтах
    value: ${{ steps.download.outputs.size-mb }}

runs:
  using: composite
  steps:
    - name: Загрузить веса
      id: download
      shell: bash
      env:
        # Ссылка на файл в хранилище моделей. Адрес вида resolve/main
        # отдаёт содержимое файла, тогда как blob/main вернул бы страницу
        # с его описанием.
        MODEL_URL: https://huggingface.co/Vikhrmodels/Vikhr-Qwen-2.5-1.5B-Instruct-GGUF/resolve/main/Vikhr-Qwen-2.5-1.5b-Instruct-Q4_K_M.gguf
        TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        set -euo pipefail

        mkdir -p "$TARGET_DIR"
        TARGET="$TARGET_DIR/model.gguf"

        # Ожидаемый размер спрашивается у хранилища, а не задаётся числом
        # в коде. Числу пришлось бы обновляться при каждом выпуске весов, а
        # заголовок отдаёт настоящую длину именно того файла, который
        # сейчас загружается. Ключ --location обязателен и здесь: хранилище
        # отвечает перенаправлением, и длина приходит в последнем ответе.
        EXPECTED=$(curl --location --silent --show-error --head "$MODEL_URL" \
          | tr -d '\r' \
          | awk 'tolower($1) == "content-length:" { value = $2 } END { print value }')

        if [ -n "${EXPECTED:-}" ]; then
          echo "Хранилище сообщает размер: $((EXPECTED / 1024 / 1024)) МБ"
        else
          echo "::warning::Хранилище не сообщило размер файла."
        fi

        # Пустой файл создаётся заранее, чтобы возобновление работало и на
        # первой попытке: без него curl нечего продолжать.
        touch "$TARGET"

        echo "Загрузка весов…"

        # Ключ --location нужен: хранилище отвечает перенаправлением на
        # сеть доставки, и без него сохранилась бы страница перенаправления.
        #
        # --continue-at - продолжает с места обрыва. Прежде каждая
        # повторная попытка начинала загрузку с нуля: обрыв на девяноста
        # процентах означал полчаса впустую и ещё полчаса на повтор.
        #
        # Ограничения по общему времени нет намеренно. Оно и погубило
        # прошлую сборку: файл дошёл до 96 процентов за тридцать минут и
        # был отброшен целиком, хотя до конца оставалось секунд двадцать.
        # Вместо него стоит определитель зависания: загрузка обрывается,
        # если скорость держится ниже 50 КБ/с дольше двух минут. Медленную,
        # но живую передачу он не трогает, а мёртвую отсекает за две минуты
        # вместо тридцати.
        curl --location --fail --show-error --silent \
             --continue-at - \
             --retry 8 --retry-delay 15 --retry-all-errors \
             --connect-timeout 30 \
             --speed-limit 51200 --speed-time 120 \
             --output "$TARGET" \
             "$MODEL_URL"

        SIZE_BYTES=$(wc -c < "$TARGET")
        SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
        echo "Получено: ${SIZE_MB} МБ"

        # Сверка с длиной, объявленной хранилищем. Проверка появилась
        # вместе с возобновлением: продолженная загрузка может дописать
        # файл не с той позиции, и получится связка из двух кусков нужного
        # размера, но с разрывом внутри. По размеру такое не отличить от
        # целого файла, а по объявленной длине — отличить.
        if [ -n "${EXPECTED:-}" ] && [ "$SIZE_BYTES" -ne "$EXPECTED" ]; then
          echo "::error::Размер не совпал с объявленным хранилищем."
          echo "::error::Получено $SIZE_BYTES байт, ожидалось $EXPECTED."
          exit 1
        fi

        # Нижняя граница на случай, если длину узнать не удалось. Задана с
        # запасом: усечённый файл почти всегда оказывается кратно меньше, а
        # точное сравнение сломалось бы при выходе новой сборки весов.
        if [ "$SIZE_MB" -lt 800 ]; then
          echo "::error::Файл весов подозрительно мал: ${SIZE_MB} МБ."
          echo "::error::Ожидается около 1060 МБ. Загрузка оборвалась."
          exit 1
        fi

        # Формат GGUF начинается с четырёх опознавательных байтов. Проверка
        # отсекает случай, когда вместо файла сохранилась страница с
        # сообщением об ошибке: по размеру такое не отличить, если сервер
        # ответил длинным текстом.
        MAGIC=$(head -c 4 "$TARGET" | tr -d '\0')
        if [ "$MAGIC" != "GGUF" ]; then
          echo "::error::Файл не является весами в формате GGUF."
          echo "::error::Первые байты: $MAGIC"
          exit 1
        fi

        echo "size-mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
        echo "Веса загружены и проверены"
