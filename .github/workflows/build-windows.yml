name: Build Windows EXE

# Два способа запуска:
#   1. Пуш тега вида v1.0.0 — сборка и публикация в Releases.
#   2. Кнопка "Run workflow" во вкладке Actions — сборка без релиза,
#      результат лежит в артефактах запуска 90 дней.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы создать релиз и приложить к нему файл

env:
  # Консоль машины сборки под Windows работает в однобайтовой
  # кодировке и отвергает кириллицу в выводе, прерывая шаг
  # ошибкой. Переменная задаёт кодировку для всех запусков
  # Python, а не только для тех, о которых известно сейчас.
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Определить версию
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Метка вида v1.9.0 задаётся при выпуске и служит источником
          # истины. При ручном запуске метки нет, поэтому берётся значение
          # из кода — так сборка для проверки остаётся возможной.
          REF="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${REF#v}"
            echo "Версия из метки: $VERSION"
          else
            VERSION=$(python -c "import sys; sys.path.insert(0, '.'); from app.config import APP_VERSION; print(APP_VERSION)")
            echo "Метки нет, версия из кода: $VERSION"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Проверить, что вендорные библиотеки на месте
        shell: pwsh
        run: |
          if (-not (Test-Path 'static/js/vendor/matter.min.js')) {
            Write-Error 'static/js/vendor/matter.min.js отсутствует в репозитории. Файл обязан быть закоммичен, иначе в сборке не будет физического движка.'
            exit 1
          }
          Write-Host 'matter.min.js на месте'

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить правила и защитный фильтр
        # Расчёт награды, штрафа, уровня сцены и работа фильтра
        # безопасности от платформы не зависят, но ошибка в них попала бы
        # сразу во все выпуски.
        run: |
          # Проверки затрагивают и маршруты сервера, поэтому нужны основные
          # библиотеки. Перечислены поимённо, а не через requirements.txt:
          # в общем списке есть оболочка окна и значок в трее, которым на
          # машине сборки взяться неоткуда, а тестам они не нужны.
          pip install pytest httpx fastapi "sqlalchemy[asyncio]" aiosqlite pydantic

          python -m pytest tests/ -q

      - name: Сверить защитные слои двух версий
        run: python tools/check_safety_parity.py

      - name: Проверить запуск интерфейса
        # Ошибки времени выполнения синтаксическая проверка не находит, а
        # приводят они к самому неприятному отказу: приложение открывается
        # и остаётся на экране загрузки навсегда, ничего не сообщая.
        run: node tools/smoke_test.js

      - name: Измерить нагрузку сцен на холст
        # Плавность отрисовки нельзя проверить глазами на машине сборки, но
        # число обращений к холсту за кадр от неё не зависит. Стенд ловит
        # возврат к дорогим приёмам — построению градиента в цикле,
        # отдельной обводке на каждую частицу — до того, как это попадёт
        # на слабое устройство.
        run: node tools/bench_clouds.js

      - name: Проверить ядро сцен и мобильную серверную часть
        # Разрешение холста, понижение профиля на слабом устройстве, останов
        # цикла вне экрана и число записей в хранилище — всё это проверяется
        # без браузера и без телефона. Ошибка здесь не роняет приложение, а
        # делает его медленным: заметить такое на машине сборки иначе нечем.
        run: |
          node tools/check_stage_profile.js
          node tools/check_local_api.js

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Сгенерировать иконку
        run: python tools/make_icon.py

      - name: Установить пакет инференса
        # Без этого пакета выпуск «с моделью» вводит в заблуждение: веса в
        # архиве лежат, приложение их видит, но выполнить не может и молча
        # переходит на заготовленные фразы. Прежде шаг отсутствовал вовсе,
        # и все выпуски до 2.0.0 включительно собирались без движка.
        #
        # На PyPI лежат только исходные тексты: обычная установка запускает
        # сборку на месте, занимает десятки минут и регулярно обрывается.
        # Готовые сборки автор публикует на отдельном указателе. Он и
        # пробуется первым; сборка из исходных текстов остаётся запасным
        # путём на случай, если для этой версии Python готовой нет.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          pip install llama-cpp-python --prefer-binary `
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

          python -c "import llama_cpp" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::Готовой сборки нет, собираю из исходных текстов.'
            pip install llama-cpp-python --no-binary :all:
          }

          # Проверка импортом, а не кодом возврата установки: пакет может
          # установиться и всё же не загрузиться, если рядом не оказалось
          # нативной библиотеки.
          python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Пакет инференса недоступен — выпуск с моделью был бы нерабочим.'
            exit 1
          }

      - name: Собрать .exe
        env:
          # Объявляет сборку требующей движка: спецификация оборвёт работу,
          # если llama-cpp-python не установлен, вместо того чтобы молча
          # собрать выпуск, который не сможет воспользоваться весами.
          MYQUESTIFY_REQUIRE_LLM: '1'
        run: pyinstaller MyQuestify.spec --noconfirm --clean

      - name: Проверить, что движок попал в сборку
        # Проверка по спискам сборки, а не по файлам на диске: приложение
        # собирается в один файл, и все нативные библиотеки лежат внутри
        # него — искать «llama*.dll» в каталоге build бессмысленно, там
        # только промежуточные списки. Прежняя редакция этого шага искала
        # именно файлы и роняла сборку, которая на деле прошла верно.
        #
        # Analysis-00.toc перечисляет всё, что вошло в архив, включая
        # нативные библиотеки. Проверка обеих записей — и модуля Python, и
        # библиотеки llama.cpp — потому что одна без другой бесполезна.
        shell: pwsh
        run: |
          $toc = Get-ChildItem -Path build -Recurse -Filter 'Analysis-*.toc' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $toc) {
            Write-Error 'Не найден список состава сборки (Analysis-*.toc).'
            exit 1
          }

          $content = Get-Content -Raw -LiteralPath $toc.FullName
          if ($content -notmatch 'llama_cpp') {
            Write-Error 'В составе сборки нет модуля llama_cpp.'
            exit 1
          }
          if ($content -notmatch 'llama[^'']*\.dll') {
            Write-Error 'В составе сборки нет нативных библиотек llama.cpp.'
            exit 1
          }

          $hits = ([regex]::Matches($content, 'llama')).Count
          Write-Host "Движок в составе сборки: упоминаний $hits"

      - name: Проверить результат
        shell: pwsh
        run: |
          $exe = 'dist/MyQuestify.exe'
          if (-not (Test-Path $exe)) { Write-Error "Файл не собран: $exe"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Собрано: $exe ($size МБ)"

          # Копия с номером версии в имени. Остальные пять файлов выпуска
          # версию в имени несут, и только этот назывался просто
          # MyQuestify.exe: скачав его, определить версию можно было лишь
          # запустив приложение.
          $version = "${{ steps.version.outputs.value }}"
          Copy-Item $exe "dist/MyQuestify-$version-windows.exe"

      - name: Загрузить веса модели
        uses: ./.github/actions/fetch-model
        with:
          target-dir: models

      - name: Собрать выпуск с моделью
        shell: pwsh
        run: |
          # Веса кладутся рядом с приложением, а не внутрь него. При
          # встраивании PyInstaller распаковывал бы гигабайт во временный
          # каталог при каждом запуске; приложение вместо этого переносит
          # файл в свой каталог данных однократно, при первом открытии.
          New-Item -ItemType Directory -Path dist/with-model -Force | Out-Null
          Copy-Item dist/MyQuestify.exe dist/with-model/
          New-Item -ItemType Directory -Path dist/with-model/models -Force | Out-Null
          Copy-Item models/model.gguf dist/with-model/models/

          $version = "${{ steps.version.outputs.value }}"
          $zip = "dist/MyQuestify-$version-windows-with-model.zip"
          Compress-Archive -Path dist/with-model/* -DestinationPath $zip -CompressionLevel Optimal

          $mb = [math]::Round((Get-Item $zip).Length / 1MB)
          Write-Host "Собрано: $zip — $mb МБ"

          # Предел вложения к выпуску — два гигабайта. Проверка здесь
          # избавляет от отказа на шаге публикации, когда время уже
          # потрачено на сборку и упаковку.
          if ($mb -gt 1900) {
            Write-Error "Архив превышает предел вложения: $mb МБ"
            exit 1
          }

      - name: Приложить к запуску (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: MyQuestify-exe
          path: dist/MyQuestify.exe
          retention-days: 90

      - name: Приложить к выпуску
        # Все три сборки — Windows, macOS и Android — запускаются по одной
        # метке одновременно и прикладывают файлы к общему выпуску. Действие
        # создаёт выпуск, если его ещё нет, и дополняет существующий, если
        # он уже создан другой сборкой. Команда создания выпуска здесь не
        # годится: та, что придёт второй, завершилась бы ошибкой.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MyQuestify-*-windows.exe
            dist/*-with-model.zip
          fail_on_unmatched_files: true
          name: MyQuestify ${{ github.ref_name }}
          body: |
            ## Загрузка

            | Файл | Платформа | Модель |
            |---|---|---|
            | `MyQuestify-<версия>-windows.exe` | Windows 10 и 11 | подключается отдельно |
            | `MyQuestify-<версия>-windows-with-model.zip` | Windows 10 и 11 | входит в состав |
            | `MyQuestify-<версия>-macos.dmg` | macOS | подключается отдельно |
            | `MyQuestify-<версия>-macos-with-model.dmg` | macOS | входит в состав |
            | `MyQuestify-<версия>-android.apk` | Android 6 и выше | подключается отдельно |
            | `MyQuestify-<версия>-android-with-model.apk` | Android 6 и выше | входит в состав |

            Установка не требуется: распакуйте и запустите.

            Выпуски с моделью работают сразу после распаковки и весят
            заметно больше — от 450 МБ на Android до примерно гигабайта на
            настольных системах. Лёгкие загружаются быстрее, модель к ним
            подключается позже.

            **Windows.** Нужен компонент Microsoft Edge WebView2. На
            Windows 11 он установлен изначально; для Windows 10 доступен
            здесь: https://developer.microsoft.com/microsoft-edge/webview2/

            **macOS.** Приложение не подписано сертификатом разработчика:
            при первом открытии нажмите на значок правой кнопкой, выберите
            «Открыть», затем «Открыть» в диалоге. Подтверждение требуется
            один раз.

            **Android.** Отладочная сборка. Потребуется разрешить установку
            из неизвестного источника — обычное поведение для приложений
            не из магазина.

            ## Языковая модель

            Без модели приложение работает полностью: вместо генерации оно
            показывает заготовленные фразы и сообщает об этом в заголовке.

            Настольные версии используют модель на полтора миллиарда
            параметров, версия для Android — на полмиллиарда: телефону
            больше не выделить. Разница в размере модели, не в
            возможностях приложения.

            Чтобы подключить модель к лёгкому выпуску, положите файл GGUF
            как `model.gguf` в каталог данных приложения — подробности в
            [docs/MODEL.md](https://github.com/${{ github.repository }}/blob/main/docs/MODEL.md).

            ## Данные

            Хранятся локально. Сетевых обращений приложение не делает.
