name: Build Windows EXE

# Два способа запуска:
#   1. Пуш тега вида v1.0.0 — сборка и публикация в Releases.
#   2. Кнопка "Run workflow" во вкладке Actions — сборка без релиза,
#      результат лежит в артефактах запуска 90 дней.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы создать релиз и приложить к нему файл

env:
  # Консоль машины сборки под Windows работает в однобайтовой
  # кодировке и отвергает кириллицу в выводе, прерывая шаг
  # ошибкой. Переменная задаёт кодировку для всех запусков
  # Python, а не только для тех, о которых известно сейчас.
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Проверить, что вендорные библиотеки на месте
        shell: pwsh
        run: |
          if (-not (Test-Path 'static/js/vendor/matter.min.js')) {
            Write-Error 'static/js/vendor/matter.min.js отсутствует в репозитории. Файл обязан быть закоммичен, иначе в сборке не будет физического движка.'
            exit 1
          }
          Write-Host 'matter.min.js на месте'

      - name: Установить Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '20'


      - name: Проверить запуск интерфейса

        # Ошибки времени выполнения синтаксическая проверка не находит, а

        # приводят они к самому неприятному отказу: приложение открывается

        # и остаётся на экране загрузки навсегда, ничего не сообщая.

        run: node tools/smoke_test.js


      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Сгенерировать иконку
        run: python tools/make_icon.py

      - name: Собрать .exe
        env:
          # llama-cpp-python на CI не ставится: сборка из исходников занимает
          # десятки минут и регулярно падает. Релизный .exe идёт с резервными
          # фразами; локальная модель подключается пользователем через
          # %LOCALAPPDATA%\MyQuestify\models\model.gguf.
          MYQUESTIFY_NO_LLM: '1'
        run: pyinstaller MyQuestify.spec --noconfirm --clean

      - name: Проверить результат
        shell: pwsh
        run: |
          $exe = 'dist/MyQuestify.exe'
          if (-not (Test-Path $exe)) { Write-Error "Файл не собран: $exe"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Собрано: $exe ($size МБ)"

      - name: Загрузить веса модели
        uses: ./.github/actions/fetch-model
        with:
          target-dir: models

      - name: Собрать выпуск с моделью
        shell: pwsh
        run: |
          # Веса кладутся рядом с приложением, а не внутрь него. При
          # встраивании PyInstaller распаковывал бы гигабайт во временный
          # каталог при каждом запуске; приложение вместо этого переносит
          # файл в свой каталог данных однократно, при первом открытии.
          New-Item -ItemType Directory -Path dist/with-model -Force | Out-Null
          Copy-Item dist/MyQuestify.exe dist/with-model/
          New-Item -ItemType Directory -Path dist/with-model/models -Force | Out-Null
          Copy-Item models/model.gguf dist/with-model/models/

          $version = python -c "import sys; sys.path.insert(0, '.'); from app.config import APP_VERSION; print(APP_VERSION)"
          $zip = "dist/MyQuestify-$version-windows-with-model.zip"
          Compress-Archive -Path dist/with-model/* -DestinationPath $zip -CompressionLevel Optimal

          $mb = [math]::Round((Get-Item $zip).Length / 1MB)
          Write-Host "Собрано: $zip — $mb МБ"

          # Предел вложения к выпуску — два гигабайта. Проверка здесь
          # избавляет от отказа на шаге публикации, когда время уже
          # потрачено на сборку и упаковку.
          if ($mb -gt 1900) {
            Write-Error "Архив превышает предел вложения: $mb МБ"
            exit 1
          }

      - name: Приложить к запуску (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: MyQuestify-exe
          path: dist/MyQuestify.exe
          retention-days: 90

      - name: Приложить к выпуску
        # Все три сборки — Windows, macOS и Android — запускаются по одной
        # метке одновременно и прикладывают файлы к общему выпуску. Действие
        # создаёт выпуск, если его ещё нет, и дополняет существующий, если
        # он уже создан другой сборкой. Команда создания выпуска здесь не
        # годится: та, что придёт второй, завершилась бы ошибкой.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MyQuestify.exe
            dist/*-with-model.zip
          fail_on_unmatched_files: true
          name: MyQuestify ${{ github.ref_name }}
          body: |
            ## Загрузка

            | Файл | Платформа | Модель |
            |---|---|---|
            | `MyQuestify.exe` | Windows 10 и 11 | подключается отдельно |
            | `MyQuestify-*-windows-with-model.zip` | Windows 10 и 11 | входит в состав |
            | `MyQuestify-*-macos.dmg` | macOS | подключается отдельно |
            | `MyQuestify-*-macos-with-model.dmg` | macOS | входит в состав |
            | `MyQuestify-*-android.apk` | Android 6 и выше | не поддерживается |

            Установка не требуется: распакуйте и запустите.

            Выпуски с моделью весят около 1.1 ГБ и работают сразу после
            распаковки. Лёгкие загружаются быстрее, а модель к ним
            подключается позже.

            **Windows.** Нужен компонент Microsoft Edge WebView2. На
            Windows 11 он установлен изначально; для Windows 10 доступен
            здесь: https://developer.microsoft.com/microsoft-edge/webview2/

            **macOS.** Приложение не подписано сертификатом разработчика:
            при первом открытии нажмите на значок правой кнопкой, выберите
            «Открыть», затем «Открыть» в диалоге. Подтверждение требуется
            один раз.

            **Android.** Отладочная сборка. Потребуется разрешить установку
            из неизвестного источника — обычное поведение для приложений
            не из магазина.

            ## Языковая модель

            В выпуск не входит. Без неё приложение работает полностью, а
            вместо генерации показывает заготовленные фразы.

            Настольные версии: положите файл GGUF как `model.gguf` в каталог
            данных приложения — подробности в
            [docs/MODEL.md](https://github.com/${{ github.repository }}/blob/main/docs/MODEL.md).

            Версия для Android работает без модели: полтора миллиарда
            параметров занимают около гигабайта, и телефон столько ни
            одному приложению не выделит.

            ## Данные

            Хранятся локально. Сетевых обращений приложение не делает.
