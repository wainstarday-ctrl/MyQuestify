name: Сборка для Android

# Сборка выполняется на машине GitHub. Это решает две задачи: не требуется
# устанавливать Android Studio с набором средств разработки объёмом в
# несколько гигабайт, и не требуется устойчивое соединение для загрузки
# сотен пакетов — у машины сборки оно заведомо надёжнее домашнего.
#
# Собирается отладочная разновидность. Она подписана временным ключом,
# устанавливается на любое устройство и годится для проверки и раздачи.
# Разновидность для публикации в магазине требует собственного ключа
# подписи, который нельзя хранить в репозитории: его огласка позволила бы
# выпустить поддельное обновление от имени автора.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Консоль машины сборки под Windows работает в однобайтовой
  # кодировке и отвергает кириллицу в выводе, прерывая шаг
  # ошибкой. Переменная задаёт кодировку для всех запусков
  # Python, а не только для тех, о которых известно сейчас.
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Определить версию
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Метка вида v1.9.0 задаётся при выпуске и служит источником
          # истины. При ручном запуске метки нет, поэтому берётся значение
          # из кода — так сборка для проверки остаётся возможной.
          REF="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${REF#v}"
            echo "Версия из метки: $VERSION"
          else
            VERSION=$(python -c "import sys; sys.path.insert(0, '.'); from app.config import APP_VERSION; print(APP_VERSION)")
            echo "Метки нет, версия из кода: $VERSION"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Проверить наличие физического движка
        run: |
          if [ ! -s static/js/vendor/matter.min.js ]; then
            echo "::error::Отсутствует static/js/vendor/matter.min.js."
            echo "::error::Без него интерактивные сцены не работают."
            exit 1
          fi
          echo "matter.min.js на месте"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить правила и защитный фильтр
        # Расчёт награды, штрафа, уровня сцены, работа фильтра безопасности и
        # поведение маршрутов сервера от платформы не зависят, но ошибка в них
        # попала бы сразу во все выпуски.
        run: |
          # Проверки затрагивают и маршруты сервера, поэтому нужны основные
          # библиотеки. Перечислены поимённо, а не через requirements.txt:
          # в общем списке есть оболочка окна и значок в трее, которым на
          # машине сборки взяться неоткуда, а тестам они не нужны.
          pip install pytest httpx fastapi "sqlalchemy[asyncio]" aiosqlite pydantic

          python -m pytest tests/ -q


      - name: Сверить защитные слои двух версий

        run: python tools/check_safety_parity.py


      - name: Проверить запуск интерфейса
        run: node tools/smoke_test.js

      - name: Измерить нагрузку сцен на холст
        # Плавность отрисовки нельзя проверить глазами на машине сборки, но
        # число обращений к холсту за кадр от неё не зависит. Стенд ловит
        # возврат к дорогим приёмам — построению градиента в цикле,
        # отдельной обводке на каждую частицу — до того, как это попадёт
        # на слабое устройство.
        run: node tools/bench_clouds.js

      - name: Проверить ядро сцен и мобильную серверную часть
        # Разрешение холста, понижение профиля на слабом устройстве, останов
        # цикла вне экрана и число записей в хранилище — всё это проверяется
        # без браузера и без телефона. Ошибка здесь не роняет приложение, а
        # делает его медленным: заметить такое на машине сборки иначе нечем.
        run: |
          node tools/check_stage_profile.js
          node tools/check_local_api.js

      - name: Установить Java
        # Средства сборки Android требуют семнадцатую версию: более старые
        # не поддерживаются, более новые не проверены разработчиками Gradle.
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установить Python для значков
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Создать значки приложения
        run: |
          pip install pillow
          python tools/make_android_icons.py

      - name: Установить зависимости оболочки
        working-directory: mobile
        run: npm install

      - name: Собрать веб-часть
        working-directory: mobile
        run: npm run build

      - name: Создать проект Android
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Проставить версию приложения
        # Оболочка создаёт проект с версией «1.0», записанной в build.gradle.
        # Имя файла выпуска при этом берётся из метки, и версии расходятся:
        # установленный из MyQuestify-2.0.0-android.apk сообщал в сведениях о
        # приложении «Версия: 1.0». Разница видна только на устройстве, и
        # определить по ней, какой именно выпуск установлен, невозможно.
        #
        # Числовой код версии Android требует целого числа и запрещает его
        # уменьшать между выпусками. Он собирается из частей номера с запасом
        # по сто значений на разряд: 2.0.0 даёт 20000, 2.1.3 — 20103.
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.value }}"
          GRADLE=mobile/android/app/build.gradle

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE"

          # Подстановка проверяется, а не предполагается: строка в шаблоне
          # оболочки может измениться с новой её версией, и тогда sed молча
          # ничего не заменит, а выпуск снова уйдёт с версией «1.0».
          grep -q "versionName \"$VERSION\"" "$GRADLE" \
            || { echo "::error::Не удалось проставить versionName $VERSION"; exit 1; }
          grep -q "versionCode $CODE" "$GRADLE" \
            || { echo "::error::Не удалось проставить versionCode $CODE"; exit 1; }

          echo "versionName $VERSION, versionCode $CODE"

      - name: Перенести значки
        run: |
          # Значки копируются поверх созданных оболочкой: та кладёт
          # изображение по умолчанию, одинаковое для всех приложений.
          cp -r mobile/android-icons/mipmap-* mobile/android/app/src/main/res/

          # Описание адаптивного значка. Начиная с восьмой версии Android
          # собирает форму сам из двух слоёв — подложки и переднего плана, —
          # обрезая её под принятую на устройстве: круг, квадрат со
          # скруглением или каплю. Без этих файлов значок окажется вписанным
          # в белый квадрат.
          mkdir -p mobile/android/app/src/main/res/mipmap-anydpi-v26

          cat > mobile/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML

          cp mobile/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             mobile/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Собрать приложение
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать файл
        run: |
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "release/MyQuestify-${{ steps.version.outputs.value }}-android.apk"
          ls -lh release/

      - name: Загрузить библиотеку выполнения модели
        # Сборка llama.cpp для WebAssembly. В мобильной версии нет Python,
        # и это единственный способ выполнить модель, не написав отдельное
        # дополнение к оболочке на C++ и Java.
        continue-on-error: true
        id: wllama
        working-directory: mobile
        run: |
          set -euo pipefail
          npm install @wllama/wllama@2.3.5

          TARGET=../static/js/vendor/wllama
          mkdir -p "$TARGET"
          cp -r node_modules/@wllama/wllama/esm/* "$TARGET/"

          # Проверка наличия исполняемого модуля: без него библиотека
          # загрузится, но откажется работать уже на устройстве.
          if [ ! -f "$TARGET/single-thread/wllama.wasm" ]; then
            echo "::error::В составе библиотеки нет исполняемого модуля."
            exit 1
          fi
          echo "Библиотека подготовлена"

      - name: Загрузить веса для мобильной версии
        # Модель существенно меньше настольной: в WebAssembly доступна
        # меньшая память, а вычисления идут в три-пять раз медленнее.
        # Полтора миллиарда параметров на телефоне непригодны.
        if: steps.wllama.outcome == 'success'
        continue-on-error: true
        id: weights
        env:
          MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
        run: |
          set -euo pipefail
          mkdir -p models

          curl --location --fail --show-error --silent \
               --retry 5 --retry-delay 10 --retry-all-errors \
               --connect-timeout 30 --max-time 900 \
               --output models/model-mobile.gguf \
               "$MODEL_URL"

          SIZE_MB=$(( $(wc -c < models/model-mobile.gguf) / 1024 / 1024 ))
          echo "Веса: ${SIZE_MB} МБ"

          if [ "$SIZE_MB" -lt 200 ]; then
            echo "::error::Файл весов подозрительно мал: ${SIZE_MB} МБ."
            exit 1
          fi

          MAGIC=$(head -c 4 models/model-mobile.gguf | tr -d '\0')
          if [ "$MAGIC" != "GGUF" ]; then
            echo "::error::Файл не является весами в формате GGUF."
            exit 1
          fi

      - name: Собрать приложение с моделью
        # Выполняется, только если оба предыдущих шага удались. Неудача не
        # отменяет основного выпуска: он уже собран и приложен.
        if: steps.weights.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail

          # Сборщик копирует веса сам: указывать их путь достаточно.
          cd mobile
          MYQUESTIFY_WITH_MODEL=1 \
          MYQUESTIFY_MODEL_PATH="$(cd .. && pwd)/models/model-mobile.gguf" \
            npm run build

          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon

          cd ../..
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "release/MyQuestify-${{ steps.version.outputs.value }}-android-with-model.apk"

          SIZE_MB=$(( $(wc -c < "release/MyQuestify-${{ steps.version.outputs.value }}-android-with-model.apk") / 1024 / 1024 ))
          echo "Приложение с моделью: ${SIZE_MB} МБ"

      - name: Приложить к сборке
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk
          retention-days: 90

      - name: Приложить к выпуску
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          fail_on_unmatched_files: true
