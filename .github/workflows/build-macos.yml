name: Сборка для macOS

# Сборка выполняется на машине GitHub с macOS. Это решает задачу, для
# которой иначе потребовался бы компьютер Apple: собрать приложение для
# macOS на Windows невозможно, поскольку PyInstaller упаковывает
# исполняемый файл той системы, на которой запущен.
#
# Запускается двумя способами:
#   * при отправке метки вида v1.2.3 — файл прикладывается к выпуску;
#   * вручную со страницы Actions — файл остаётся вложением сборки.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Консоль машины сборки под Windows работает в однобайтовой
  # кодировке и отвергает кириллицу в выводе, прерывая шаг
  # ошибкой. Переменная задаёт кодировку для всех запусков
  # Python, а не только для тех, о которых известно сейчас.
  PYTHONIOENCODING: utf-8

jobs:
  build:
    # Процессор Apple: собранное приложение работает и на Intel через
    # встроенный переводчик команд, тогда как обратное неверно.
    runs-on: macos-14

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          # Версия выбрана не самая новая: под неё существуют готовые сборки
          # llama-cpp-python, тогда как для свежих их приходится собирать
          # из исходных текстов, что занимает десятки минут.
          python-version: '3.12'

      - name: Проверить наличие физического движка
        run: |
          if [ ! -s static/js/vendor/matter.min.js ]; then
            echo "::error::Отсутствует static/js/vendor/matter.min.js."
            echo "::error::Без него интерактивные сцены не работают."
            echo "::error::Файл должен быть закоммичен в репозиторий."
            exit 1
          fi
          echo "matter.min.js на месте"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить запуск интерфейса
        # Ошибки времени выполнения синтаксическая проверка не находит, а
        # приводят они к самому неприятному отказу: приложение открывается
        # и остаётся на экране загрузки навсегда.
        run: node tools/smoke_test.js

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Установить пакет инференса
        # Отдельным шагом с продолжением при ошибке: его отсутствие не
        # должно отменять сборку. Приложение в этом случае работает на
        # заготовленных фразах, о чём сообщает в шапке.
        continue-on-error: true
        run: "pip install llama-cpp-python --only-binary=:all:"

      - name: Собрать приложение
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh --skip-deps --dmg

      - name: Определить версию
        id: version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, '.'); from app.config import APP_VERSION; print(APP_VERSION)")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Переименовать образ диска
        run: |
          cd dist
          for f in *.dmg; do
            mv "$f" "MyQuestify-${{ steps.version.outputs.value }}-macos.dmg" 2>/dev/null || true
          done
          ls -lh *.dmg

      - name: Загрузить веса модели
        uses: ./.github/actions/fetch-model
        with:
          target-dir: models

      - name: Собрать выпуск с моделью
        run: |
          set -euo pipefail

          # Приложение в macOS — каталог со строгой раскладкой. Веса
          # кладутся в Contents/Resources: это принятое место для
          # сопутствующих файлов, и приложение проверяет его при запуске.
          # Файл рядом с приложением система при переносе не захватила бы,
          # и веса потерялись бы при первом же перемещении значка.
          APP='dist/with-model/MyQuestify.app'
          mkdir -p dist/with-model
          cp -R dist/MyQuestify.app dist/with-model/

          mkdir -p "$APP/Contents/Resources/models"
          cp models/model.gguf "$APP/Contents/Resources/models/model.gguf"

          VERSION="${{ steps.version.outputs.value }}"
          STAGE='dist/dmg-model'
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          DMG="dist/MyQuestify-${VERSION}-macos-with-model.dmg"
          hdiutil create -volname 'MyQuestify' -srcfolder "$STAGE" \
              -ov -format UDZO "$DMG" >/dev/null
          rm -rf "$STAGE" dist/with-model

          SIZE_MB=$(( $(stat -f%z "$DMG") / 1024 / 1024 ))
          echo "Собрано: $DMG — ${SIZE_MB} МБ"

          # Предел вложения к выпуску — два гигабайта.
          if [ "$SIZE_MB" -gt 1900 ]; then
            echo "::error::Образ превышает предел вложения: ${SIZE_MB} МБ"
            exit 1
          fi

      - name: Приложить к сборке
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          retention-days: 90

      - name: Приложить к выпуску
        # Только для меток: ручной запуск оставляет файл вложением сборки,
        # не создавая выпуска.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
