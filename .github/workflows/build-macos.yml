name: Сборка для macOS

# Сборка выполняется на машине GitHub с macOS. Это решает задачу, для
# которой иначе потребовался бы компьютер Apple: собрать приложение для
# macOS на Windows невозможно, поскольку PyInstaller упаковывает
# исполняемый файл той системы, на которой запущен.
#
# Запускается двумя способами:
#   * при отправке метки вида v1.2.3 — файл прикладывается к выпуску;
#   * вручную со страницы Actions — файл остаётся вложением сборки.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Консоль машины сборки под Windows работает в однобайтовой
  # кодировке и отвергает кириллицу в выводе, прерывая шаг
  # ошибкой. Переменная задаёт кодировку для всех запусков
  # Python, а не только для тех, о которых известно сейчас.
  PYTHONIOENCODING: utf-8

jobs:
  build:
    # Процессор Apple: собранное приложение работает и на Intel через
    # встроенный переводчик команд, тогда как обратное неверно.
    runs-on: macos-14

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Определить версию
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Метка вида v1.9.0 задаётся при выпуске и служит источником
          # истины. При ручном запуске метки нет, поэтому берётся значение
          # из кода — так сборка для проверки остаётся возможной.
          REF="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${REF#v}"
            echo "Версия из метки: $VERSION"
          else
            VERSION=$(python -c "import sys; sys.path.insert(0, '.'); from app.config import APP_VERSION; print(APP_VERSION)")
            echo "Метки нет, версия из кода: $VERSION"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          # Версия выбрана не самая новая: под неё существуют готовые сборки
          # llama-cpp-python, тогда как для свежих их приходится собирать
          # из исходных текстов, что занимает десятки минут.
          python-version: '3.12'

      - name: Проверить наличие физического движка
        run: |
          if [ ! -s static/js/vendor/matter.min.js ]; then
            echo "::error::Отсутствует static/js/vendor/matter.min.js."
            echo "::error::Без него интерактивные сцены не работают."
            echo "::error::Файл должен быть закоммичен в репозиторий."
            exit 1
          fi
          echo "matter.min.js на месте"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить правила и защитный фильтр
        # Расчёт награды, штрафа, уровня сцены, работа фильтра безопасности и
        # поведение маршрутов сервера от платформы не зависят, но ошибка в них
        # попала бы сразу во все выпуски.
        run: |
          # Проверки затрагивают и маршруты сервера, поэтому нужны основные
          # библиотеки. Перечислены поимённо, а не через requirements.txt:
          # в общем списке есть оболочка окна и значок в трее, которым на
          # машине сборки взяться неоткуда, а тестам они не нужны.
          pip install pytest httpx fastapi "sqlalchemy[asyncio]" aiosqlite pydantic

          python -m pytest tests/ -q


      - name: Сверить защитные слои двух версий

        run: python tools/check_safety_parity.py


      - name: Проверить запуск интерфейса
        # Ошибки времени выполнения синтаксическая проверка не находит, а
        # приводят они к самому неприятному отказу: приложение открывается
        # и остаётся на экране загрузки навсегда.
        run: node tools/smoke_test.js

      - name: Измерить нагрузку сцен на холст
        # Плавность отрисовки нельзя проверить глазами на машине сборки, но
        # число обращений к холсту за кадр от неё не зависит. Стенд ловит
        # возврат к дорогим приёмам — построению градиента в цикле,
        # отдельной обводке на каждую частицу — до того, как это попадёт
        # на слабое устройство.
        run: node tools/bench_clouds.js

      - name: Проверить ядро сцен и мобильную серверную часть
        # Разрешение холста, понижение профиля на слабом устройстве, останов
        # цикла вне экрана и число записей в хранилище — всё это проверяется
        # без браузера и без телефона. Ошибка здесь не роняет приложение, а
        # делает его медленным: заметить такое на машине сборки иначе нечем.
        run: |
          node tools/check_stage_profile.js
          node tools/check_local_api.js

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Установить пакет инференса
        # Прежде шаг стоял с продолжением при ошибке, и ошибка случалась
        # каждый раз: на PyPI для этого пакета выложены только исходные
        # тексты, а ключ --only-binary запрещает сборку на месте. Выпуск
        # 2.0.0 для macOS ушёл с весами и без движка — приложение сообщало
        # «модель не найдена», хотя образ диска весил 961 МБ.
        #
        # Готовые сборки лежат на отдельном указателе автора. Для машин на
        # процессорах Apple берётся разновидность с поддержкой Metal, при
        # её отсутствии — обычная, и лишь в последнюю очередь пакет
        # собирается из исходных текстов.
        run: |
          set -uo pipefail

          install_from() {
            pip install llama-cpp-python --prefer-binary --extra-index-url "$1" \
              && python -c "import llama_cpp" 2>/dev/null
          }

          install_from https://abetlen.github.io/llama-cpp-python/whl/metal \
            || install_from https://abetlen.github.io/llama-cpp-python/whl/cpu \
            || {
              echo "::warning::Готовой сборки нет, собираю из исходных текстов."
              pip install llama-cpp-python --no-binary :all:
            }

          # Проверка импортом: установка может пройти, а библиотека — не
          # загрузиться, если рядом не оказалось нативной части.
          python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)" || {
            echo "::error::Пакет инференса недоступен — выпуск с моделью был бы нерабочим."
            exit 1
          }

      - name: Собрать приложение
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh --skip-deps --dmg

      - name: Переименовать образ диска
        run: |
          cd dist
          for f in *.dmg; do
            mv "$f" "MyQuestify-${{ steps.version.outputs.value }}-macos.dmg" 2>/dev/null || true
          done
          ls -lh *.dmg

      - name: Загрузить веса модели
        uses: ./.github/actions/fetch-model
        with:
          target-dir: models

      - name: Собрать выпуск с моделью
        run: |
          set -euo pipefail

          # Приложение в macOS — каталог со строгой раскладкой. Веса
          # кладутся в Contents/Resources: это принятое место для
          # сопутствующих файлов, и приложение проверяет его при запуске.
          # Файл рядом с приложением система при переносе не захватила бы,
          # и веса потерялись бы при первом же перемещении значка.
          APP='dist/with-model/MyQuestify.app'
          mkdir -p dist/with-model
          cp -R dist/MyQuestify.app dist/with-model/

          mkdir -p "$APP/Contents/Resources/models"
          cp models/model.gguf "$APP/Contents/Resources/models/model.gguf"

          VERSION="${{ steps.version.outputs.value }}"
          STAGE='dist/dmg-model'
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          DMG="dist/MyQuestify-${VERSION}-macos-with-model.dmg"
          hdiutil create -volname 'MyQuestify' -srcfolder "$STAGE" \
              -ov -format UDZO "$DMG" >/dev/null
          rm -rf "$STAGE" dist/with-model

          SIZE_MB=$(( $(stat -f%z "$DMG") / 1024 / 1024 ))
          echo "Собрано: $DMG — ${SIZE_MB} МБ"

          # Предел вложения к выпуску — два гигабайта.
          if [ "$SIZE_MB" -gt 1900 ]; then
            echo "::error::Образ превышает предел вложения: ${SIZE_MB} МБ"
            exit 1
          fi

      - name: Приложить к сборке
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          retention-days: 90

      - name: Приложить к выпуску
        # Только для меток: ручной запуск оставляет файл вложением сборки,
        # не создавая выпуска.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
